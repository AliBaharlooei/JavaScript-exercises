<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>form</title>
</head>
<body>
    <div class="container">
        <div class="step" id="step-one">
            <div class="input">
                <label for="">نام</label>
                <input type="text" id="input-firstname">
                <label for="">نام خانوادگی</label>
                <input type="text" id="input-lastname">
            </div>
            <div class="btns">
                <button type="submit" class="next">بعدی</button>
            </div>
        </div>
        <div class="step" id="step-two">
            <div class="input">
                <label for="">آدرس</label>
                <input type="text" id="input-firstname">
                <label for="">سن</label>
                <input type="text" id="input-lastname">
            </div>
            <div class="btns">
                <button type="submit" class="next">نتایج</button>
                <button type="submit" class="before">قبلی</button>
            </div>
        </div>
        <div class="step" id="result">
            <div class="input">
                <label for="">نام : </label>
                <label for="">نام خانوادگی : </label>
                <label for="">آدرس : </label>
                <label for="">سن : </label>
                
            </div>
            <div class="btns">
                <button type="submit" class="before">ویرایش</button>
            </div>
        </div>
    </div>
</body>
</html>
